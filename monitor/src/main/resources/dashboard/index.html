 <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Bot Monitor</title>
<style>
  :root {
    --bg: #f4f2ee; --card: #ffffff; --text: #1d1c1a; --muted: #6b6760; --line: #e3dfd8;
    --light-sq: #ece6d6; --dark-sq: #a8896a; --last: rgba(214, 180, 60, .55);
    --good: #2f8f4e; --bad: #c2412d; --warn: #b7791f; --idle: #5b6bbf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --card: #22211e; --text: #ece9e3; --muted: #9a958c; --line: #33312d;
      --light-sq: #b9ab93; --dark-sq: #7a5f45; --last: rgba(214, 180, 60, .5);
      --good: #4cbb6c; --bad: #e0634d; --warn: #d9a03f; --idle: #8894e0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  a { color: inherit; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; color: #fff; background: var(--muted); }
  .pill.playing { background: var(--good); } .pill.idle { background: var(--idle); }
  .pill.offline, .pill.down { background: var(--bad); } .pill.starting { background: var(--warn); }
  .dots { display: flex; gap: 14px; color: var(--muted); font-size: 13px; margin-left: auto; flex-wrap: wrap; }
  .dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
  .dot.on::before { background: var(--good); } .dot.off::before { background: var(--bad); }
  .error { background: color-mix(in srgb, var(--bad) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
           border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .label { color: var(--muted); font-size: 12px; text-transform: capitalize; }
  .tile .value { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .sub { font-size: 12px; color: var(--muted); }
  .up { color: var(--good); } .down { color: var(--bad); }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .game .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 8px; }
  .game .meta b { font-weight: 600; }
  .boardwrap { display: flex; gap: 8px; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; border-radius: 4px; overflow: hidden; }
  .sq { display: flex; align-items: center; justify-content: center; font-size: min(7vw, 30px); line-height: 1; user-select: none; }
  .sq.l { background: var(--light-sq); } .sq.d { background: var(--dark-sq); }
  .sq.last { box-shadow: inset 0 0 0 100px var(--last); }
  .pw { color: #fff; text-shadow: 0 0 2px #000, 0 0 1px #000; } .pb { color: #111; text-shadow: 0 0 1px #fff8; }
  .evalbar { width: 12px; border-radius: 4px; overflow: hidden; background: #333; display: flex; flex-direction: column-reverse; }
  .evalbar div { background: #f2f2f2; transition: height .4s; }
  .game .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .clock.ticking { color: var(--text); font-weight: 600; }
  .empty { color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .res { font-weight: 650; } .res.WIN { color: var(--good); } .res.LOSS { color: var(--bad); } .res.DRAW { color: var(--muted); }
  @media (max-width: 560px) { .hide-sm { display: none; } }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="bot">Chess bot</h1>
    <span id="state" class="pill">…</span>
    <div class="dots">
      <span id="dot-process" class="dot">Process</span>
      <span id="dot-online" class="dot">Lichess</span>
    </div>
  </header>
  <div id="error" class="error" hidden></div>

  <div class="tiles" id="ratings"></div>

  <h2>Live games</h2>
  <div id="live" class="games"></div>

  <h2>Today</h2>
  <div class="tiles" id="today"></div>

  <h2>Recent games</h2>
  <table>
    <thead><tr><th>Result</th><th>Opponent</th><th class="hide-sm">Speed</th><th class="num">±</th><th class="hide-sm num">When</th></tr></thead>
    <tbody id="recent"></tbody>
  </table>

  <footer id="updated"></footer>
</main>
<script>
const GLYPH = { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" };
let status = null, fetchedAt = 0;

const el = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const signed = n => (n > 0 ? "+" : "") + n;
const cls = n => n > 0 ? "up" : n < 0 ? "down" : "";

function ago(ms) {
  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}

function clock(sec) {
  if (sec == null) return "";
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
}

function board(fen, colour, lastMove) {
  const rows = fen.split(" ")[0].split("/").map(r => r.replace(/\d/g, d => ".".repeat(+d)));
  const last = lastMove ? [lastMove.slice(0, 2), lastMove.slice(2, 4)] : [];
  let html = "";
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    const r = colour === "black" ? 7 - i : i, c = colour === "black" ? 7 - j : j;
    const ch = rows[r]?.[c] ?? ".";
    const name = "abcdefgh"[c] + (8 - r);
    const piece = ch === "." ? "" : `<span class="${ch === ch.toUpperCase() ? "pw" : "pb"}">${GLYPH[ch.toLowerCase()]}</span>`;
    html += `<div class="sq ${(r + c) % 2 ? "d" : "l"}${last.includes(name) ? " last" : ""}">${piece}</div>`;
  }
  return html;
}

function evalHeight(cp) {
  if (cp == null) return 50;
  return 50 + 50 * (2 / (1 + Math.exp(-cp / 400)) - 1);
}

function render() {
  if (!status) return;
  el("bot").textContent = status.bot;
  document.title = `${status.bot} · ${status.state.toLowerCase()}`;
  const st = el("state");
  st.textContent = status.state.toLowerCase();
  st.className = "pill " + status.state.toLowerCase();

  const dot = (id, v) => el(id).className = "dot" + (v === true ? " on" : v === false ? " off" : "");
  dot("dot-process", status.processRunning);
  dot("dot-online", status.lichessOnline);
  el("dot-process").hidden = status.processRunning == null;

  el("error").hidden = !status.lastError;
  el("error").textContent = status.lastError ? "Last poll failed: " + status.lastError : "";

  el("ratings").innerHTML = Object.entries(status.ratings).map(([speed, r]) => `
    <div class="tile"><div class="label">${esc(speed)}</div>
      <div class="value">${r.rating}${r.provisional ? "?" : ""}</div>
      <div class="sub"><span class="${cls(r.progress)}">${signed(r.progress)}</span> recent · ${r.games} games</div></div>`).join("")
    || `<div class="empty">No ratings yet</div>`;

  const t = status.today;
  el("today").innerHTML = [
    ["games", t.games, ""], ["wins", t.wins, "up"], ["losses", t.losses, "down"], ["draws", t.draws, ""],
    ["rating change", signed(t.ratingChange), cls(t.ratingChange)],
  ].map(([label, v, c]) => `<div class="tile"><div class="label">${label}</div><div class="value ${c}">${v}</div></div>`).join("");

  if (!status.liveGamesAvailable) {
    el("live").innerHTML = `<div class="empty">Set LICHESS_TOKEN to see live games.</div>`;
  } else if (!status.liveGames.length) {
    el("live").innerHTML = `<div class="empty">Not playing right now.</div>`;
  } else {
    el("live").innerHTML = status.liveGames.map(g => `
      <div class="game">
        <div class="meta"><span>vs <b>${esc(g.opponent)}</b>${g.opponentRating ? ` (${g.opponentRating})` : ""}</span>
          <a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.speed)}${g.rated ? "" : " · casual"} ↗</a></div>
        <div class="boardwrap">
          <div class="evalbar" title="Bot's advantage (monitor eval, not the bot's search)"><div style="height:${evalHeight(g.evalCp)}%"></div></div>
          <div class="board">${board(g.fen, g.colour, g.lastMove)}</div>
        </div>
        <div class="foot">
          <span>${g.botToMove ? "Bot to move" : "Opponent to move"} · eval ${g.evalCp == null ? "–" : signed((g.evalCp / 100).toFixed(1))}</span>
          <span class="clock${g.botToMove ? " ticking" : ""}" data-left="${g.botSecondsLeft ?? ""}" data-ticking="${g.botToMove}">${clock(g.botSecondsLeft)}</span>
        </div>
      </div>`).join("");
  }

  el("recent").innerHTML = status.recentGames.map(g => `
    <tr><td><a class="res ${g.outcome}" href="${esc(g.url)}" target="_blank" rel="noopener">${g.outcome.toLowerCase()}</a></td>
      <td>${esc(g.opponent)}${g.opponentRating ? ` <span class="sub">(${g.opponentRating})</span>` : ""}</td>
      <td class="hide-sm">${esc(g.speed)}${g.rated ? "" : " · casual"}</td>
      <td class="num ${cls(g.ratingDiff)}">${g.ratingDiff == null ? "" : signed(g.ratingDiff)}</td>
      <td class="hide-sm num">${ago(g.endedAt)}</td></tr>`).join("")
    || `<tr><td colspan="5" class="sub">No games yet</td></tr>`;

  el("updated").textContent = status.updatedAt ? "Updated " + ago(status.updatedAt) : "Waiting for first update…";
}

// The bot's clock between polls, counted down locally while it's the bot's move.
function tickClocks() {
  const elapsed = (Date.now() - fetchedAt) / 1000;
  document.querySelectorAll(".clock[data-ticking=true]").forEach(c => {
    if (c.dataset.left !== "") c.textContent = clock(+c.dataset.left - elapsed);
  });
}

async function poll() {
  try {
    const res = await fetch("api/status", { cache: "no-store" });
    if (res.ok) { status = await res.json(); fetchedAt = Date.now(); render(); }
  } catch (e) {
    el("error").hidden = false;
    el("error").textContent = "Monitor unreachable";
  }
}

poll();
setInterval(poll, 3000);
setInterval(tickClocks, 500);
</script>
</body>
</html>
