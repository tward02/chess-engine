name: CI

on:
  push:
  pull_request:

# A newer push to the same branch/PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Only this repo's own runner (not the org runner, nor the NNUE runner busy with hours-long cycles).
    runs-on: [self-hosted, chess-engine]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileKotlin --console=plain

      # Every module's test task; :engine:test excludes @LongRunning (perft depths, gates, A/B runs).
      # xvfb gives the Compose UI tests (desktop/client/ui) a display. --continue runs every module's
      # tests even after one fails, so a single run reports all the failures.
      - name: Test
        run: xvfb-run --auto-servernum ./gradlew test --continue --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test/'
          retention-days: 7
